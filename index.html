<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SleepingKindle v0.8</title>
<meta name="theme-color" content="#263b36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="SleepingKindle">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">

<style>
:root{
  --bg:#eef1f4; --panel:#ffffff; --line:#c7ccd1; --text:#1b1d1f;
  --accent:#2f5d50; --accent2:#e7f0ed; --shadow:0 6px 20px rgba(0,0,0,.10);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;color:var(--text);background:var(--bg)}
button,select,input,textarea{font:inherit}
header{
  height:calc(58px + env(safe-area-inset-top));display:flex;align-items:center;gap:12px;padding:env(safe-area-inset-top) 16px 0;
  background:#263b36;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18)
}
header h1{font-size:20px;margin:0;font-weight:700}
.image-tools{display:none;align-items:center;gap:8px;flex-wrap:wrap;width:100%;padding-top:2px}
.image-tools.active{display:flex}
.file-button{display:inline-flex;align-items:center;gap:6px;border:1px solid #aeb5bb;border-radius:7px;padding:6px 10px;background:#fff;cursor:pointer}
.file-button input{display:none}
.image-name{font-size:12px;color:#5d646a;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.small-btn{border:1px solid #aeb5bb;border-radius:7px;padding:6px 9px;background:#fff}
.kindle-screen.image-bg{background-repeat:no-repeat;background-position:center;background-size:cover;touch-action:none}
.kindle-screen.image-bg{touch-action:none;cursor:grab}
.kindle-screen.image-bg:active{cursor:grabbing}
.adjust-help{width:100%;padding:7px 9px;border-radius:7px;background:#e7f0ed;color:#234b40;font-size:12px;font-weight:600}
.segmented{display:inline-flex;border:1px solid #aeb5bb;border-radius:8px;overflow:hidden;background:#fff}
.segmented button{border:0;border-right:1px solid #aeb5bb;border-radius:0;background:#fff;padding:6px 10px}
.segmented button:last-child{border-right:0}
.segmented button.active{background:#2f5d50;color:#fff}

.kindle-screen.outline-white{color:#fff;text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 -2px 0 #000,0 2px 0 #000,-2px 0 0 #000,2px 0 0 #000}
.kindle-screen.outline-black{color:#000;text-shadow:-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,2px 2px 0 #fff,0 -2px 0 #fff,0 2px 0 #fff,-2px 0 0 #fff,2px 0 0 #fff}
.kindle-screen.no-outline{text-shadow:none}
header .ver{font-size:12px;opacity:.75}
header .spacer{flex:1}
header button{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:8px;padding:8px 12px}
main{height:calc(100% - 58px - env(safe-area-inset-top));display:grid;grid-template-columns:minmax(320px,1fr) minmax(360px,1fr);gap:12px;padding:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-height:0;overflow:hidden}
.editor-panel{display:grid;grid-template-rows:auto 1fr auto}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px;border-bottom:1px solid var(--line);background:#f8f9fa}
.field{display:flex;align-items:center;gap:5px;font-size:13px}
.field select,.field input{border:1px solid #aeb5bb;border-radius:7px;padding:6px 8px;background:#fff}
textarea{
  width:100%;height:100%;resize:none;border:0;outline:0;padding:16px;
  font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:15px;line-height:1.55
}
.statusbar{padding:7px 12px;border-top:1px solid var(--line);font-size:12px;color:#62686d;background:#fafafa;display:flex;justify-content:space-between}
.preview-panel{display:grid;grid-template-rows:auto 1fr}
.preview-head{padding:10px 14px;border-bottom:1px solid var(--line);background:#f8f9fa;display:flex;align-items:center;justify-content:space-between}
.preview-head strong{font-size:14px}
.preview-wrap{
  overflow:hidden;
  padding:20px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#d9dde0;
}
.kindle-frame{
  background:#1b1f21;
  border-radius:34px;
  box-shadow:
    0 18px 42px rgba(0,0,0,.34),
    inset 0 0 0 2px rgba(255,255,255,.035);
  position:relative;
  box-sizing:border-box;
  flex:0 0 auto;
}
.kindle-frame:after{
  content:"kindle";
  position:absolute;
  left:0;
  right:0;
  bottom:28px;
  text-align:center;
  color:#8c9092;
  font-size:28px;
  letter-spacing:2px;
  line-height:1;
}
.kindle-frame.landscape:after{
  left:auto;
  right:28px;
  top:0;
  bottom:0;
  width:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  writing-mode:vertical-rl;
}
.preview-viewport.light{background:#f7f7f2}
.preview-viewport.dark{background:#121212}

.preview-viewport{
  width:100%;
  height:100%;
  position:relative;
  overflow:hidden;
  background:#f7f7f2;
  box-shadow:inset 0 0 12px rgba(0,0,0,.22);
}
.kindle-screen{
  position:absolute;
  left:0;
  top:0;
  width:1264px;
  height:1680px;
  box-sizing:border-box;
  background:#f7f7f2;
  overflow:hidden;
  padding:7%;
  box-shadow:none;
  color:#111;
  filter:grayscale(1);
  transform-origin:top left;
}
.kindle-screen.dark{background:#121212;color:#f5f5f5}
.kindle-screen.serif{font-family:"Yu Mincho","Hiragino Mincho ProN",serif}
.kindle-screen.sans{font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif}
.kindle-screen.mono{font-family:"SFMono-Regular",Consolas,monospace}
.kindle-screen h1{font-size:2em;line-height:1.25;margin:.1em 0 .7em;border-bottom:3px solid currentColor;padding-bottom:.18em}
.kindle-screen h2{font-size:1.45em;margin:1em 0 .5em}
.kindle-screen p{margin:.55em 0;line-height:1.55}
.kindle-screen ul,.kindle-screen ol{padding-left:1.5em;line-height:1.55}
.kindle-screen .checklist{list-style:none;padding-left:.15em}
.kindle-screen .checklist li{display:flex;gap:.45em;align-items:flex-start}
.kindle-screen .checkmark{flex:0 0 auto;font-family:sans-serif}
.kindle-screen hr{border:0;border-top:2px solid currentColor;margin:1em 0}
.kindle-screen table{border-collapse:collapse;width:100%;margin:.8em 0;font-size:.92em}
.kindle-screen th,.kindle-screen td{border:1.5px solid currentColor;padding:.42em .55em;vertical-align:top}
.kindle-screen th{font-weight:700;background:rgba(127,127,127,.14)}
.fit-content{width:100%;max-width:100%;transform:none}
.notice{font-size:12px;color:#666}
.primary{background:var(--accent)!important;color:white!important;border-color:var(--accent)!important}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.58}
#sendBtn{min-width:112px;font-weight:700;white-space:nowrap;padding:7px 10px}
.preview-actions{display:flex;align-items:center;gap:8px;min-width:0}
.preview-head .notice{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#photoBtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.notice.warn{color:#b42318;font-weight:700}
@media(max-width:520px){
  .preview-head{padding:8px 10px}
  .preview-head strong{font-size:13px}
  #previewNotice{display:none}
  #sendBtn{min-width:108px;padding:7px 9px}
}
@media(max-width:850px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(360px,48%) minmax(420px,52%);height:auto;min-height:calc(100% - 58px)}
  .panel{min-height:420px}
}

.template-dialog{border:0;border-radius:14px;padding:0;width:min(620px,calc(100vw - 20px));max-height:calc(100dvh - 20px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.template-dialog::backdrop{background:rgba(0,0,0,.45)}
.template-box{display:grid;grid-template-rows:auto 1fr auto;max-height:calc(100dvh - 20px);background:#fff}
.template-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.template-head h2{font-size:17px;margin:0}.template-head .spacer{flex:1}
.template-close{border:1px solid #aeb5bb;border-radius:7px;background:#fff;padding:5px 9px}
.template-body{overflow:auto;padding:10px 12px}.template-section-title{font-size:12px;font-weight:700;color:#596068;margin:0 0 6px}
.builtin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:11px}
.builtin-card{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fafbfb;min-width:0;text-align:left;cursor:pointer}
.builtin-card:active{transform:translateY(1px)}
.builtin-icon{font-size:20px;line-height:1;flex:none}.builtin-text{min-width:0}.builtin-card strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.builtin-card small{display:block;font-size:11px;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.user-list{display:grid;gap:6px}.user-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:6px;background:#fafbfb}
.user-name{min-width:0;border:0;background:transparent;text-align:left;padding:5px 6px;border-radius:6px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.user-name[disabled]{color:#6a7075;font-weight:400}.user-name:not([disabled]):active{background:#e8eeec}
.user-row button:not(.user-name){border:1px solid #aeb5bb;border-radius:7px;background:#fff;padding:6px 8px;white-space:nowrap}.user-row button.load-template{background:var(--accent);color:#fff;border-color:var(--accent)}
.template-foot{padding:7px 12px;border-top:1px solid var(--line);font-size:11px;line-height:1.35;color:#666;background:#fafafa}
@media(max-width:420px){
 .template-dialog{width:calc(100vw - 12px);max-height:calc(100dvh - 12px)}
 .template-box{max-height:calc(100dvh - 12px)}
 .template-head{padding:8px 9px}.template-head h2{font-size:15px}
 .template-body{padding:8px 9px}.builtin-grid{gap:5px;margin-bottom:8px}.builtin-card{padding:7px 8px;gap:6px}.builtin-icon{font-size:18px}.builtin-card strong{font-size:13px}.builtin-card small{font-size:10px}
 .user-list{gap:5px}.user-row{gap:4px;padding:4px}.user-row button:not(.user-name){padding:5px 6px;font-size:12px}.user-name{padding:5px 4px;font-size:12px}
 .template-foot{padding:6px 9px;font-size:10px}
}

/* SugarPad v1.0 */
.sugarpad{position:fixed;left:18px;top:120px;z-index:5000;background:rgba(248,249,250,.97);border:1px solid #9ea6ad;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.22);padding:6px;user-select:none;-webkit-user-select:none;touch-action:none;max-width:calc(100vw - 12px)}
.sugarpad.hidden{display:none}
.sugarpad-row{display:flex;align-items:center;gap:4px;white-space:nowrap}
.sugarpad-row + .sugarpad-row{margin-top:4px}
.sugarpad button{border:1px solid #aeb5bb;background:#fff;color:#1b1d1f;border-radius:7px;font-weight:650;line-height:1;min-width:34px;height:32px;padding:0 7px;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.sugarpad button:active{background:#e4e8eb}
.sugarpad .sp-drag{cursor:grab;background:#e7ecea;color:#314843;touch-action:none}
.sugarpad .sp-drag:active{cursor:grabbing}
.sugarpad .sp-skb.off{background:#5a6268;color:#fff;border-color:#5a6268}
.sugarpad .sp-skb.on{background:#2f5d50;color:#fff;border-color:#2f5d50}
.sugarpad .sp-mode{background:#e7f0ed;border-color:#9db8af;color:#234b40}
.sugarpad .sp-pagebar{display:flex;align-items:center;gap:4px;border-top:1px solid #c9ced2;margin-top:6px;padding-top:6px}
.sugarpad .sp-page-name{flex:1;text-align:center;font-size:12px;font-weight:700;min-width:80px;color:#41474c}
.sugarpad .sp-ext{margin-top:4px}
.sugarpad .sp-ext .sugarpad-row{flex-wrap:wrap;white-space:normal;max-width:330px}
.sugarpad.mini .sp-pagebar,.sugarpad.mini .sp-ext{display:none}
.sugarpad.size-small button{height:28px;min-width:29px;padding:0 5px;font-size:12px}.sugarpad.size-small{padding:5px}.sugarpad.size-small .sugarpad-row{gap:3px}.sugarpad.size-small .sp-page-name{font-size:11px}
.sugarpad.size-large button{height:40px;min-width:42px;padding:0 9px;font-size:16px}.sugarpad.size-large{padding:8px}.sugarpad.size-large .sugarpad-row{gap:6px}.sugarpad.size-large .sp-page-name{font-size:14px}
.sugarpad .sp-user-grid{display:grid;grid-template-columns:repeat(3,minmax(72px,1fr));gap:5px;max-width:330px;white-space:normal}
.sugarpad .sp-user-grid button{height:auto;min-height:34px;line-height:1.2;white-space:normal;padding:6px}
.sugarpad .sp-user-head{display:flex;align-items:center;gap:4px;margin-bottom:5px}
.sugarpad .sp-user-title{flex:1;font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugarpad .sp-user-tools{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.sugarpad .sp-user-tools button{font-size:11px;min-width:0}
#sugarPadToggle{border:1px solid #aeb5bb;border-radius:7px;padding:6px 9px;background:#fff}
.sp-toast{position:fixed;z-index:6000;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(20,23,25,.92);color:#fff;border-radius:8px;padding:8px 12px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .18s}.sp-toast.show{opacity:1}
@media(max-width:560px){.sugarpad{left:8px;top:96px}.sugarpad .sp-user-grid{grid-template-columns:repeat(2,minmax(76px,1fr));max-width:240px}}

</style>
</head>
<body>
<header>
  <h1>SleepingKindle</h1><span class="ver">v0.8d</span>
  <div class="spacer"></div>
  <button id="sampleBtn">例文</button>
  <button id="newBtn">新規</button>
</header>

<dialog id="templateDialog" class="template-dialog">
  <div class="template-box">
    <div class="template-head"><h2>例文・テンプレート</h2><div class="spacer"></div><button id="templateCloseBtn" class="template-close" type="button">閉じる</button></div>
    <div id="templateBody" class="template-body"></div>
    <div class="template-foot">ユーザー例文には本文と表示設定を保存します（写真は対象外）。登録名の長押しで削除できます。</div>
  </div>
</dialog>

<main>
<section class="panel editor-panel">
  <div class="toolbar">
    <label class="field">フォント
      <select id="fontSel">
        <option value="sans">ゴシック</option>
        <option value="serif">明朝</option>
        <option value="mono">等幅</option>
      </select>
    </label>
    <label class="field">サイズ
      <select id="sizeSel">
        <option value="14">小</option>
        <option value="17" selected>中</option>
        <option value="21">大</option>
        <option value="26">特大</option>
      </select>
    </label>
    <label class="field">背景
      <select id="themeSel">
        <option value="light">白</option>
        <option value="dark">黒</option>
      </select>
    </label>
    <button id="photoBtn" class="small-btn" type="button" aria-expanded="false">写真</button>
    <button id="sugarPadToggle" type="button" aria-pressed="true">SugarPad</button>
    <label class="field">余白
      <select id="marginSel">
        <option value="4">狭い</option>
        <option value="7" selected>標準</option>
        <option value="10">広い</option>
      </select>
    </label>
    <label class="field">向き
      <select id="orientationSel">
        <option value="portrait" selected>縦</option>
        <option value="landscape">横</option>
      </select>
    </label>
    <div id="imageTools" class="image-tools">
      <label class="file-button">画像を選択
        <input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp">
      </label>
      <span id="imageName" class="image-name">画像未選択</span>
      <label class="field">画像表現
        <select id="imageModeSel">
          <option value="photo" selected>写真</option>
          <option value="pencil">鉛筆画</option>
          <option value="line">線画</option>
        </select>
      </label>
      <label class="field">白黒反転
        <input id="invertImageChk" type="checkbox">
      </label>
      <label class="field">E-ink最適化
        <select id="einkSel">
          <option value="normal" selected>標準</option>
          <option value="clear">明瞭</option>
          <option value="strong">強調</option>
        </select>
      </label>
      <button id="resetImageBtn" class="small-btn" type="button">位置を初期化</button>
      <div class="adjust-help">プレビュー上でドラッグして移動・ピンチで拡大縮小・ダブルタップで初期化</div>
      <label class="field">文字色
        <select id="textColorSel">
          <option value="white" selected>白</option>
          <option value="black">黒</option>
        </select>
      </label>
      <label class="field">縁取り
        <select id="outlineSel">
          <option value="on" selected>あり</option>
          <option value="off">なし</option>
        </select>
      </label>
      <label class="field">文字揃え
        <select id="textAlignSel">
          <option value="left" selected>左</option>
          <option value="center">中央</option>
          <option value="right">右</option>
        </select>
      </label>
      <button id="removeImageBtn" class="small-btn" type="button">画像を外す</button>
    </div>
  </div>

  <textarea id="source" spellcheck="false" aria-label="掲示内容入力" placeholder="ここへ掲示内容を入力してください"></textarea>

  <div class="statusbar">
    <span id="count">0文字</span>
    <span>書く → 見る → Kindleへ送る</span>
  </div>
</section>

<div id="sugarPad" class="sugarpad size-normal" aria-label="SugarPad">
  <div class="sugarpad-row">
    <button type="button" class="sp-drag" id="spDrag" title="ドラッグして移動">⠿</button>
    <button type="button" class="sp-mode" id="spMode" title="mini/標準切替">mini</button>
    <button type="button" class="sp-skb off" id="spSKB" title="ソフトキーボード許可">SKB</button>
    <button type="button" data-spcmd="ret" title="改行">RET</button>
    <button type="button" data-spcmd="left" title="1文字左">←</button>
    <button type="button" data-spcmd="right" title="1文字右">→</button>
    <button type="button" data-spcmd="bs">BS</button>
    <button type="button" data-spcmd="del">DEL</button>
  </div>
  <div class="sugarpad-row">
    <button type="button" data-spcmd="undo">Undo</button>
    <button type="button" data-spcmd="redo">Redo</button>
    <button type="button" data-spcmd="cut">Cut</button>
    <button type="button" data-spcmd="copy">Copy</button>
    <button type="button" data-spcmd="paste">Paste</button>
    <button type="button" id="spSize" title="サイズ切替">標準</button>
    <button type="button" id="spClose" title="SugarPadを閉じる">×</button>
  </div>
  <div class="sp-pagebar">
    <button type="button" id="spPrevPage">◀</button>
    <span class="sp-page-name" id="spPageName">Markdown</span>
    <button type="button" id="spNextPage">▶</button>
  </div>
  <div class="sp-ext" id="spExt"></div>
</div>
<div id="spToast" class="sp-toast" role="status"></div>
<input id="spImportFile" type="file" accept="application/json,.json" hidden>

<section class="panel preview-panel">
  <div class="preview-head">
    <strong>Kindle画面プレビュー</strong>
    <div class="preview-actions">
      <span id="previewNotice" class="notice">確認中</span>
      <button id="sendBtn" class="primary" title="現在のプレビューを表紙にしたEPUBを生成します">Kindleへ送る</button>
    </div>
  </div>
  <div class="preview-wrap">
    <div class="kindle-frame">
      <div id="previewViewport" class="preview-viewport">
        <article id="preview" class="kindle-screen sans"></article>
      </div>
    </div>
  </div>
</section>
</main>

<script src="jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
const starter = `# タイトル

ここへ入力してください。`;

const builtInTemplates = [
  {name:'本日の予定', icon:'📅', description:'予定表・太字', text:`# 本日の予定

function processImageFile(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('画像ファイルを読み込めませんでした。'));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('画像形式を認識できませんでした。'));
      img.onload=()=>{
        const maxSide=2500;
        const scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
        const canvas=document.createElement('canvas');
        canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
        canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
        const ctx=canvas.getContext('2d');
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',0.9));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

    gy += lum(texture2D(u,uv+px*vec2(-1.0,1.0)).rgb); gy += 2.0*lum(texture2D(u,uv+px*vec2(0.0,1.0)).rgb); gy += lum(texture2D(u,uv+px*vec2(1.0,1.0)).rgb);

      nearMean += lum(texture2D(u,uv+px*vec2(-1.0, 1.0)).rgb)*2.0;

      nearMean += lum(texture2D(u,uv+px*vec2( 1.0,-1.0)).rgb)*2.0;
      nearMean += lum(texture2D(u,uv+px*vec2( 1.0, 0.0)).rgb)*2.0;
      nearMean += lum(texture2D(u,uv+px*vec2( 1.0, 1.0)).rgb)*2.0;
      nearMean += lum(texture2D(u,uv+px*vec2( 2.0, 0.0)).rgb);
      nearMean/=24.0;

      farMean += lum(texture2D(u,uv+px*vec2( 6.0, 0.0)).rgb)*2.0;
      farMean += lum(texture2D(u,uv+px*vec2(-6.0, 6.0)).rgb);

function esc(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function inline(s){
  const brToken='__KINDLE_BOARD_BR__';
  return esc(s.replace(/<br\s*\/?>/gi,brToken))
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replaceAll(brToken,'<br>');
}

function parseMarkdown(text){
  const lines = text.replace(/\r/g,'').split('\n');
  let html='', i=0, listType='';

  const closeList=()=>{
    if(!listType) return;
    html+=listType==='ol'?'</ol>':'</ul>';
    listType='';
  };
  const openList=type=>{
    if(listType===type) return;
    closeList();
    html+=type==='ol'?'<ol>':type==='check'?'<ul class="checklist">':'<ul>';
    listType=type;
  };

  while(i<lines.length){
    const line=lines[i];

    if(/^#\s+/.test(line)){ closeList(); html+=`<h1>${inline(line.replace(/^#\s+/,''))}</h1>`; i++; continue; }
    if(/^##\s+/.test(line)){ closeList(); html+=`<h2>${inline(line.replace(/^##\s+/,''))}</h2>`; i++; continue; }
    if(/^---+$/.test(line.trim())){ closeList(); html+='<hr>'; i++; continue; }

    const checkMatch=line.match(/^\s*[-*]\s+\[([ xX])\]\s+(.*)$/);
    if(checkMatch){
      openList('check');
      const mark=checkMatch[1].toLowerCase()==='x'?'☑':'☐';
      html+=`<li><span class="checkmark">${mark}</span><span>${inline(checkMatch[2])}</span></li>`;
      i++; continue;
    }

    const orderedMatch=line.match(/^\s*\d+\.\s+(.*)$/);
    if(orderedMatch){
      openList('ol');
      html+=`<li>${inline(orderedMatch[1])}</li>`;
      i++; continue;
    }

    if(/^\s*[-*]\s+/.test(line)){
      openList('ul');
      html+=`<li>${inline(line.replace(/^\s*[-*]\s+/,''))}</li>`;
      i++; continue;
    }

    if(line.includes('|') && i+1<lines.length && /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[i+1])){
      closeList();
      const rows=[];
      const splitRow = r => r.trim().replace(/^\||\|$/g,'').split('|').map(v=>v.trim());
      const head=splitRow(line);
      const separators=splitRow(lines[i+1]);
      const aligns=separators.map(v=>{
        const left=v.startsWith(':');
        const right=v.endsWith(':');
        return left && right ? 'center' : right ? 'right' : 'left';
      });
      const columnCount=Math.max(head.length,separators.length);
      while(head.length<columnCount) head.push('');
      while(aligns.length<columnCount) aligns.push('left');
      i+=2;
      while(i<lines.length && lines[i].includes('|') && lines[i].trim()!==''){
        const row=splitRow(lines[i]);
        while(row.length<columnCount) row.push('');
        rows.push(row.slice(0,columnCount));
        i++;
      }
      html+='<table><thead><tr>'+head.map((c,idx)=>`<th style="text-align:${aligns[idx]}">${inline(c)}</th>`).join('')+'</tr></thead><tbody>';
      html+=rows.map(r=>'<tr>'+r.map((c,idx)=>`<td style="text-align:${aligns[idx]}">${inline(c)}</td>`).join('')+'</tr>').join('');
      html+='</tbody></table>';
      continue;
    }

    closeList();
    if(line.trim()===''){ html+='<div style="height:.45em"></div>'; }
    else if(/^\[[a-z]+=/i.test(line.trim())){ /* 設定記法は表示しない */ }
    else { html+=`<p>${inline(line)}</p>`; }
    i++;
  }
  closeList();
  return html || '<p style="opacity:.55">ここにプレビューが表示されます。</p>';
}

function fitContentToSheet(sheet, content, safety=FIT_SAFETY, selectedFontSize=null){
  // v0.5f:
  // 選択された文字サイズを縦横で共通の絶対サイズとして維持する。
  // 自動縮小は行わず、収まらない場合は警告だけを返す。
  content.style.transform='none';
  content.style.width='100%';

  const selectedBase=selectedFontSize ?? parseFloat(sheet.style.fontSize) ?? 17;
  sheet.style.fontSize=selectedBase+'px';

  const cs=getComputedStyle(sheet);
  const horizontalPadding=parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight);
  const verticalPadding=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);

  const availableWidth=Math.max(1,sheet.clientWidth-horizontalPadding);
  const availableHeight=Math.max(1,(sheet.clientHeight-verticalPadding)*safety);

  void content.offsetHeight;

  const overflowX=content.scrollWidth>availableWidth+1;
  const overflowY=content.scrollHeight>availableHeight+1;

  return {
    fits:!(overflowX||overflowY),
    overflowX,
    overflowY,
    contentWidth:content.scrollWidth,
    contentHeight:content.scrollHeight,
    availableWidth,
    availableHeight
  };
}


function getCanvasSize(){
  return orientationSel && orientationSel.value==='landscape'
    ? {width:1680,height:1264}
    : {width:1264,height:1680};
}

function getPagePaddingPx(){
  const marginLevel=Number(marginSel.value);

  // 縦横で同じ物理感を保ちながら、向きに応じて配分だけ変える。
  const base={
    4:60,
    7:88,
    10:118
  }[marginLevel] || 88;

  if(orientationSel.value==='landscape'){
    return {
      top:Math.round(base*0.82),
      right:Math.round(base*1.08),
      bottom:Math.round(base*0.82),
      left:Math.round(base*1.08)
    };
  }

  return {
    top:base,
    right:base,
    bottom:base,
    left:base
  };
}

function getFrameMetrics(){
  const {width,height}=getCanvasSize();

  if(orientationSel.value==='landscape'){
    // Paperwhiteを横へ90度回した外観。
    const top=90;
    const right=190;
    const bottom=90;

function applyOrientation(){
  const m=getFrameMetrics();

  preview.style.width=m.screenWidth+'px';
  preview.style.height=m.screenHeight+'px';

  previewViewport.style.width=m.screenWidth+'px';
  previewViewport.style.height=m.screenHeight+'px';

  if(kindleFrame){
    const landscape=orientationSel.value==='landscape';
    kindleFrame.classList.toggle('landscape', landscape);
    kindleFrame.style.width=m.frameWidth+'px';
    kindleFrame.style.height=m.frameHeight+'px';
    kindleFrame.style.padding=
      m.top+'px '+m.right+'px '+m.bottom+'px '+m.left+'px';
    kindleFrame.style.aspectRatio='auto';
  }
}

function scalePreviewCanvas(){
  if(!previewWrap || !kindleFrame) return;
  const m=getFrameMetrics();

  const cs=getComputedStyle(previewWrap);
  const maxWidth=Math.max(
    1,
    previewWrap.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)
  );
  const maxHeight=Math.max(
    1,
    previewWrap.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)
  );
  const fitScale=Math.min(maxWidth/m.frameWidth,maxHeight/m.frameHeight,1);

  kindleFrame.style.flex='0 0 auto';

  const scale=fitScale;
  kindleFrame.style.transform=`scale(${scale})`;
  kindleFrame.style.transformOrigin='center center';

  kindleFrame.style.marginLeft=((m.frameWidth*scale-m.frameWidth)/2)+'px';
  kindleFrame.style.marginRight=((m.frameWidth*scale-m.frameWidth)/2)+'px';
  kindleFrame.style.marginTop=((m.frameHeight*scale-m.frameHeight)/2)+'px';
  kindleFrame.style.marginBottom=((m.frameHeight*scale-m.frameHeight)/2)+'px';
}

resetImageBtn.addEventListener('click',resetCurrentTransform);
preview.addEventListener('pointerdown',e=>{
  if(!backgroundImageData) return;
  preview.setPointerCapture(e.pointerId);
  const t=currentTransform();
  if(!gestureState) gestureState={pointers:new Map(),startX:t.x,startY:t.y,startScale:t.scale};
  gestureState.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(gestureState.pointers.size===1){gestureState.origin={x:e.clientX,y:e.clientY};gestureState.startX=t.x;gestureState.startY=t.y;}
  if(gestureState.pointers.size===2){
    const pts=[...gestureState.pointers.values()];
    gestureState.startDistance=Math.hypot(pts[1].x-pts[0].x,pts[1].y-pts[0].y);
    gestureState.startScale=t.scale;
  }
  e.preventDefault();
});
preview.addEventListener('pointermove',e=>{
  if(!gestureState || !gestureState.pointers.has(e.pointerId)) return;
  gestureState.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const t=currentTransform();
  if(gestureState.pointers.size===1){
    const p=[...gestureState.pointers.values()][0];
    const rect=preview.getBoundingClientRect();
    const logicalPerCss=getCanvasSize().width/Math.max(1,rect.width);
    t.x=gestureState.startX+(p.x-gestureState.origin.x)*logicalPerCss;
    t.y=gestureState.startY+(p.y-gestureState.origin.y)*logicalPerCss;
  }else if(gestureState.pointers.size>=2){
    const pts=[...gestureState.pointers.values()].slice(0,2);
    const d=Math.hypot(pts[1].x-pts[0].x,pts[1].y-pts[0].y);
    t.scale=Math.min(5,Math.max(1,d/Math.max(1,gestureState.startDistance)*gestureState.startScale));
  }
  backgroundSizing(preview);
  e.preventDefault();
});
function endPointer(e){
  if(!gestureState) return;
  gestureState.pointers.delete(e.pointerId);
  if(!gestureState.pointers.size){gestureState=null;saveSettingsOnly();}
  else if(gestureState.pointers.size===1){const p=[...gestureState.pointers.values()][0];const t=currentTransform();gestureState.origin={x:p.x,y:p.y};gestureState.startX=t.x;gestureState.startY=t.y;}
}
preview.addEventListener('pointerup',endPointer);
preview.addEventListener('pointercancel',endPointer);
preview.addEventListener('dblclick',e=>{
  if(backgroundImageData){
    e.preventDefault();
    e.stopPropagation();
    resetCurrentTransform();
  }
});

function getTemplateSettings(){
  return {
    font:fontSel.value,
    size:sizeSel.value,
    theme:themeSel.value,
    margin:marginSel.value,
    orientation:orientationSel.value,
    textAlign:textAlignSel.value
  };
}

function applyTemplateSettings(settings={}){
  if(settings.font) fontSel.value=settings.font;
  if(settings.size) sizeSel.value=settings.size;
  if(settings.theme) themeSel.value=settings.theme;
  if(settings.margin) marginSel.value=settings.margin;
  if(settings.orientation) orientationSel.value=settings.orientation;
  if(settings.textAlign) textAlignSel.value=settings.textAlign;
}

function loadUserTemplates(){
  try{
    const stored=JSON.parse(localStorage.getItem(USER_TEMPLATE_KEY)||'[]');
    return Array.from({length:USER_TEMPLATE_SLOTS},(_,i)=>stored[i]||null);
  }catch(e){
    return Array(USER_TEMPLATE_SLOTS).fill(null);
  }
}

function saveUserTemplates(templates){
  localStorage.setItem(USER_TEMPLATE_KEY,JSON.stringify(templates));
}

function confirmTemplateOverwrite(){
  if(!source.value.trim()) return true;
  return confirm('現在の本文をテンプレートで上書きしますか？');
}

function applyTemplate(template,withSettings){
  if(!confirmTemplateOverwrite()) return;
  source.value=template.text||'';
  if(withSettings) applyTemplateSettings(template.settings||{});
  templateDialog.close();
  render();
  source.focus();
}

function renderTemplateMenu(){
  const users=loadUserTemplates();
  const builtCards=builtInTemplates.map((t,i)=>`<button type="button" class="builtin-card" data-built="${i}"><span class="builtin-icon">${esc(t.icon||'📄')}</span><span class="builtin-text"><strong>${esc(t.name)}</strong><small>${esc(t.description)}</small></span></button>`).join('');
  const userRows=users.map((t,i)=>{
    const name=t?.name||`ユーザー枠 ${i+1}（未登録）`;
    return `<div class="user-row"><button type="button" class="user-name" ${t?`data-user-name="${i}" title="長押しで削除"`:'disabled'}>${esc(name)}</button>${t?`<button type="button" class="load-template" data-user-load="${i}">読込</button>`:'<span></span>'}<button type="button" data-user-save="${i}">${t?'保存':'登録'}</button></div>`;
  }).join('');
  templateBody.innerHTML=`<div class="template-section-title">組み込み例文</div><div class="builtin-grid">${builtCards}</div><div class="template-section-title">ユーザー例文</div><div class="user-list">${userRows}</div>`;

  templateBody.querySelectorAll('[data-built]').forEach(btn=>btn.onclick=()=>applyTemplate(builtInTemplates[Number(btn.dataset.built)],false));
  templateBody.querySelectorAll('[data-user-load]').forEach(btn=>btn.onclick=()=>applyTemplate(loadUserTemplates()[Number(btn.dataset.userLoad)],true));
  templateBody.querySelectorAll('[data-user-save]').forEach(btn=>btn.onclick=()=>{
    const index=Number(btn.dataset.userSave);
    const current=loadUserTemplates();
    if(current[index] && !confirm(`「${current[index].name}」を現在の内容で上書きしますか？`)) return;
    const entered=prompt('テンプレート名を入力してください',current[index]?.name||`テンプレート ${index+1}`);
    if(entered===null) return;
    const name=entered.trim();
    if(!name){ alert('テンプレート名を入力してください。'); return; }
    current[index]={name,text:source.value,settings:getTemplateSettings()};
    saveUserTemplates(current);
    renderTemplateMenu();
  });

  const deleteUserTemplate=index=>{
    const current=loadUserTemplates();
    if(!current[index] || !confirm(`「${current[index].name}」を削除しますか？`)) return;
    current[index]=null;
    saveUserTemplates(current);
    renderTemplateMenu();
  };
  templateBody.querySelectorAll('[data-user-name]').forEach(btn=>{
    const index=Number(btn.dataset.userName);
    let timer=null;
    const cancel=()=>{if(timer){clearTimeout(timer);timer=null;}};
    const startHold=e=>{cancel();timer=setTimeout(()=>{timer=null;deleteUserTemplate(index);},650);};
    btn.addEventListener('pointerdown',startHold);
    btn.addEventListener('pointerup',cancel);
    btn.addEventListener('pointercancel',cancel);
    btn.addEventListener('pointerleave',cancel);
    btn.addEventListener('contextmenu',e=>{e.preventDefault();cancel();deleteUserTemplate(index);});
  });
}

function xmlEscape(s){
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'
  }[c]));
}

function getDocumentTitle(){
  const firstHeading = source.value.split(/\r?\n/)
    .map(v => v.trim())
    .find(v => /^#\s+/.test(v));
  const title = firstHeading ? firstHeading.replace(/^#\s+/, '').trim() : 'SleepingKindle';
  return title || 'SleepingKindle';
}

function safeFileName(name){
  return name.replace(/[\\/:*?"<>|]/g,'_').replace(/\s+/g,' ').trim().slice(0,60) || 'SleepingKindle';
}

async function makeCoverPng(){
  if(typeof html2canvas === 'undefined'){
    throw new Error('画像生成ライブラリを読み込めませんでした。通信状態を確認してください。');
  }

  const stage = document.createElement('div');
  const {width,height}=getCanvasSize();
  stage.style.cssText = [
    'position:fixed','left:-10000px','top:0',
    'width:'+width+'px','height:'+height+'px','overflow:hidden',
    'background:' + (themeSel.value === 'dark' ? '#121212' : '#f7f7f2'),
    'z-index:-1'
  ].join(';');

  const sheet = document.createElement('article');
  sheet.className = 'kindle-screen ' + fontSel.value + (themeSel.value === 'dark' ? ' dark' : '');
  sheet.style.cssText = [
    'width:'+width+'px','height:'+height+'px','overflow:hidden',
    'box-sizing:border-box',
    'font-size:' + (Number(sizeSel.value) * 3.05) + 'px',
    'padding:' + (()=>{
      const p=getPagePaddingPx();
      return p.top+'px '+p.right+'px '+p.bottom+'px '+p.left+'px';
    })(),
    'box-shadow:none'
  ].join(';');

  applyImageAppearance(sheet);

  const content = document.createElement('div');
  content.className='fit-content';
  content.innerHTML = (backgroundImageData && !source.value.trim()) ? '' : parseMarkdown(source.value);
  sheet.appendChild(content);

  stage.appendChild(sheet);
  document.body.appendChild(stage);
  try{
    await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
    fitContentToSheet(sheet,content,FIT_SAFETY,Number(sizeSel.value)*3.05);

    const canvas = await html2canvas(sheet,{
      width:width,
      height:height,
      scale:1,
      backgroundColor: themeSel.value === 'dark' ? '#121212' : '#f7f7f2',
      useCORS:true,
      logging:false
    });
    const blob = await new Promise((resolve,reject)=>{
      canvas.toBlob(b => b ? resolve(b) : reject(new Error('表紙画像を生成できませんでした。')), 'image/png');
    });
    return blob;
  } finally {
    stage.remove();
  }
}

async function buildEpub(){
  if(typeof JSZip === 'undefined'){
    throw new Error('EPUB生成ライブラリを読み込めませんでした。通信状態を確認してください。');
  }

  const title = getDocumentTitle();
  const uid = 'kindle-board-' + Date.now();
  const modified = new Date().toISOString().replace(/\.\d{3}Z$/,'Z');
  const coverBlob = await makeCoverPng();
  // SafariでJSZipへBlobを直接渡す際の互換性問題を避ける
  const coverBytes = new Uint8Array(await coverBlob.arrayBuffer());

  const zip = new JSZip();
  zip.file('mimetype','application/epub+zip',{compression:'STORE'});

  zip.folder('META-INF').file('container.xml',
`<?xml version="1.0" encoding="UTF-8"?>
<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">
  <rootfiles>
    <rootfile full-path="EPUB/package.opf" media-type="application/oebps-package+xml"/>
  </rootfiles>
</container>`);

  const epub = zip.folder('EPUB');
  epub.file('cover.png', coverBytes);

  epub.file('cover.xhtml',
`<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops">
<head>
  <title>${xmlEscape(title)}</title>
  <meta name="viewport" content="width=${getCanvasSize().width},height=${getCanvasSize().height}"/>
  <style>
    html,body{margin:0;padding:0;width:100%;height:100%;background:${themeSel.value==='dark'?'#121212':'#f7f7f2'}}
    img{display:block;width:100%;height:100%;object-fit:contain}
  </style>
</head>
<body epub:type="cover">
  <img src="cover.png" alt="${xmlEscape(title)}"/>
</body>
</html>`);

  epub.file('source.xhtml',
`<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <title>${xmlEscape(title)} — Markdown原文</title>
  <meta charset="UTF-8"/>
  <style>
    html,body{
      margin:0;
      padding:0;
      background:#fff;
      color:#111;
    }
    body{
      padding:1.2em;
      font-family:serif;
      line-height:1.65;
    }
    h1{
      font-size:1.35em;
      margin:0 0 1em;
      padding-bottom:.35em;
      border-bottom:1px solid #888;
    }
    pre{
      margin:0;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
      word-break:normal;
      font-family:monospace;
      font-size:.95em;
      line-height:1.6;
    }
  </style>
</head>
<body>
  <h1>Markdown原文</h1>
  <pre>${xmlEscape(source.value)}</pre>
</body>
</html>`);

  epub.file('nav.xhtml',
`<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops">
<head><title>目次</title></head>
<body>
<nav epub:type="toc">
  <ol>
    <li><a href="cover.xhtml">${xmlEscape(title)}</a></li>
    <li><a href="source.xhtml">Markdown原文</a></li>
  </ol>
</nav>
</body>
</html>`);

  epub.file('package.opf',
`<?xml version="1.0" encoding="UTF-8"?>
<package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="book-id">
  <metadata xmlns:dc="http://purl.org/dc/elements/1.1/">
    <dc:identifier id="book-id">${xmlEscape(uid)}</dc:identifier>
    <dc:title>${xmlEscape(title)}</dc:title>
    <dc:language>ja</dc:language>
    <dc:creator>SleepingKindle</dc:creator>
    <meta property="dcterms:modified">${modified}</meta>
    <meta name="cover" content="cover-image"/>
  </metadata>
  <manifest>
    <item id="cover-image" href="cover.png" media-type="image/png" properties="cover-image"/>
    <item id="cover-page" href="cover.xhtml" media-type="application/xhtml+xml"/>
    <item id="source-page" href="source.xhtml" media-type="application/xhtml+xml"/>
    <item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/>
  </manifest>
  <spine>
    <itemref idref="cover-page"/>
    <itemref idref="source-page"/>
  </spine>
</package>`);

  const blob = await zip.generateAsync({
    type:'blob',
    mimeType:'application/epub+zip',
    compression:'DEFLATE',
    compressionOptions:{level:6}
  });
  return {blob,title};
}

async function shareOrDownloadEpub(blob,title){
  const filename = safeFileName(title) + '.epub';
  const file = new File([blob], filename, {type:'application/epub+zip'});

  // iPadOS SafariではcanShare({files})自体が例外になる場合があるため、
  // 能力判定を独立して保護する。
  let canShareFile = false;
  if(navigator.share){
    try{
      canShareFile = typeof navigator.canShare === 'function'
        ? navigator.canShare({files:[file]})
        : false;
    }catch(err){
      console.warn('ファイル共有可否の判定に失敗しました。保存へ切り替えます。', err);
      canShareFile = false;
    }
  }

  if(canShareFile){
    try{
      await navigator.share({
        title:title,
        text:'SleepingKindleで作成したKindleスリープ画面です。',
        files:[file]
      });
      return 'shared';
    }catch(err){
      if(err && err.name === 'AbortError') return 'cancelled';
      console.warn('共有に失敗しました。保存へ切り替えます。', err);
      // 共有が失敗した場合は保存へフォールバック
    }
  }

  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  return 'downloaded';
}

document.getElementById('sendBtn').onclick=async()=>{
  const btn = document.getElementById('sendBtn');
  if(!source.value.trim() && !backgroundImageData){
    alert('掲示内容を入力するか、写真を選択してください。');
    source.focus();
    return;
  }

  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = '作成中…';

  try{
    const previewContent=preview.querySelector('.fit-content');
    if(previewContent){
      const fit=fitContentToSheet(
        preview,
        previewContent,
        FIT_SAFETY,
        Number(sizeSel.value)*3.05
      );

      if(!fit.fits){
        const proceed=confirm(
          '現在の内容は表紙内に収まりません。\n' +
          '文字サイズ・余白・向き・内容量を調整することをおすすめします。\n\n' +
          'このままEPUBを作成しますか？'
        );
        if(!proceed) return;
      }
    }

    const {blob,title} = await buildEpub();
    btn.textContent = '共有中…';
    const result = await shareOrDownloadEpub(blob,title);
    if(result === 'downloaded'){
      alert('EPUBを保存しました。保存したファイルをSend to Kindleで送信してください。');
    }
  }catch(err){
    console.error(err);
    alert('EPUBを作成できませんでした。\n' + (err && err.message ? err.message : err));
  }finally{
    btn.disabled = false;
    btn.textContent = original;
  }
};
